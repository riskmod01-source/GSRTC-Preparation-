name: gsrtc_sarthi
description: "A new Flutter project for GSRTC Exam Preparation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "app_icon.png"
  adaptive_icon_background: "#0F4C3A"
  adaptive_icon_foreground: "app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - app_icon.png
    
