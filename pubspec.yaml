name: gsrtc_sarthi
description: "A new Flutter project for GSRTC Exam Preparation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2

  # Firebase Core, Auth & Google Sign-In
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Cloud Firestore Database
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "app_icon.png.png"
  adaptive_icon_background: "#0F4C3A"
  adaptive_icon_foreground: "app_icon.png.png"

flutter:
  uses-material-design: true
  assets:
    - app_icon.png.png
